version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=jobapplier
      - DB_USERNAME=sa
      - DB_PASSWORD=your_strong_password_here
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: jobapplier
      MYSQL_USER: sa
      MYSQL_PASSWORD: your_strong_password_here
      MYSQL_ROOT_PASSWORD: your_strong_password_here
      MYSQL_ROOT_HOST: "%"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data: